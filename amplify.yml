version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm -v
        - npm ci

frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*